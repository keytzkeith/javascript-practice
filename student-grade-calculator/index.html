<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <title>GradeLi Students Grade Tracker</title>
  </head>
  <body>
    <nav>
      <header>
        <img
          src="gradeli-horizontal-logo.svg"
          class="logo"
          alt="GradeLi logo"
        />
        <span class="title">
          <h1>Student Grade Calculator</h1>
        </span>
        <i class="fa-solid fa-bars"></i>
      </header>
    </nav>
    <main>
      <div class="main-info">
        <span id="error"></span>
        <form id="form">
            <div class="details-input input">
                
                <div class="name-input user-input">
                  <label for="first-name">First Name</label>
                  <input
                    type="text"
                    name="name"
                    required
                    placeholder="First Name"
                    id="first-name"
                  />
                </div>
                
                <div class="mark-input user-input">
                  <label for="marks">Marks</label>
                  <input
                    type="number"
                    name="marks"
                    required
                    placeholder="Marks"
                    id="marks"
                    min="0"
                    max="100"
                  />
                </div>
            </div>

          

          
          <div class="add-button btn">
            <button type="submit" id="add">
              <span class="btn-text">Add</span>
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>

        </form>


        <!-- Table record -->
        <table class="students-record">
          <thead>
            <tr>
              <th>No.</th>
              <th>Name</th>
              <th>Marks</th>
              <th>Grade</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="students"></tbody>
        </table>
        <div class="bottom">
          <div></div>
          <div class="top-student" id="top-student-element">
            <span class="top-title">
              <h3>Top Student</h3>
            </span>
            <span class="top-name" id="top-student-name"></span>
            <span class="top-marks" id="top-student-marks"></span>
            <span class="top-grade" id="top-student-grade"></span>
          </div>
          <div class="calculate-button btn">
            <button type="submit" id="calculate">
              <span class="btn-text">Calculate</span>
            </button>
          </div>
        </div>
      </div>
      <!-- Total students -->
      <div class="summary-info" id="summary">
        <div class="total-students summary">
          <span class="summary-label"> Total Students </span>
          <h1 class="summary-value" id="total-students"></h1>
        </div>

        <!-- Class average -->
        <div class="class-average summary">
          <span class="summary-label"> Class Average </span>
          <h1 class="summary-value" id="class-average"></h1>
        </div>

        <!-- Pass Fail Summary -->
        <div class="pass-fail">
          <div class="pass summary">
            <span class="summary-label"> Pass </span>
            <div class="pass-fail-value">
              <h1 class="summary-value" id="pass-count"></h1>
              <span class="percentage" id="pass-percentage"></span>
            </div>
          </div>

          <div class="fail summary">
            <span class="summary-label"> Fail </span>
            <div class="pass-fail-value">
              <h1 class="summary-value" id="fail-count"></h1>
              <span class="percentage" id="fail-percentage"></span>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="index.js"></script>
  </body>
</html>
